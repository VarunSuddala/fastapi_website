<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastAPI Complete Tutorial</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #0f1528;
    --bg3: #141a30;
    --panel: #1a2040;
    --border: #2a3560;
    --accent: #00d4ff;
    --accent2: #7c4dff;
    --accent3: #00ff94;
    --warn: #ff6b35;
    --text: #e8eaf6;
    --text2: #8892b0;
    --code-bg: #0d1117;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* SIDEBAR */
  #sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    z-index: 100;
    display: flex;
    flex-direction: column;
  }

  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg2);
    z-index: 10;
  }

  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: #fff;
  }

  .logo-text {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .sidebar-subtitle { font-size: 11px; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; }

  .search-box {
    margin-top: 12px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
  }

  .search-box input {
    background: none; border: none; outline: none;
    color: var(--text); font-family: 'Sora', sans-serif;
    font-size: 13px; width: 100%;
  }

  .search-box input::placeholder { color: var(--text2); }

  #toc { padding: 12px 0; flex: 1; }

  .toc-item {
    padding: 8px 20px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text2);
    border-left: 3px solid transparent;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
  }

  .toc-item:hover { color: var(--text); background: rgba(0,212,255,0.05); border-left-color: rgba(0,212,255,0.3); }
  .toc-item.active { color: var(--accent); background: rgba(0,212,255,0.08); border-left-color: var(--accent); font-weight: 600; }

  .toc-num {
    font-size: 10px; font-weight: 700;
    background: var(--panel); border-radius: 4px;
    padding: 2px 5px; min-width: 24px;
    text-align: center; color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
  }

  .toc-item.active .toc-num { background: rgba(0,212,255,0.2); color: var(--accent); }

  /* MAIN CONTENT */
  #main {
    margin-left: 280px;
    flex: 1;
    max-width: calc(100vw - 280px);
  }

  .top-bar {
    position: sticky; top: 0;
    background: rgba(10,14,26,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 48px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 50;
  }

  .breadcrumb { font-size: 13px; color: var(--text2); }
  .breadcrumb span { color: var(--accent); }

  .progress-wrap { display: flex; align-items: center; gap: 10px; }
  .progress-bar { width: 120px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s; }
  .progress-text { font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }

  /* SECTIONS */
  .section {
    padding: 60px 48px;
    border-bottom: 1px solid var(--border);
    animation: fadeIn 0.4s ease;
    max-width: 900px;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .section-header {
    display: flex; align-items: flex-start; gap: 16px;
    margin-bottom: 32px;
  }

  .section-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700;
    color: var(--accent2);
    background: rgba(124,77,255,0.15);
    border: 1px solid rgba(124,77,255,0.3);
    padding: 4px 10px; border-radius: 6px;
    white-space: nowrap; margin-top: 4px;
  }

  .section h2 {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(90deg, #fff 60%, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1.2;
  }

  .section h3 {
    font-size: 18px; font-weight: 700;
    color: var(--accent);
    margin: 28px 0 12px;
    display: flex; align-items: center; gap: 8px;
  }

  .section h3::before { content: '▸'; color: var(--accent2); font-size: 14px; }

  .section p {
    color: var(--text2); line-height: 1.8; margin-bottom: 16px; font-size: 15px;
  }

  .section p strong { color: var(--text); font-weight: 600; }

  /* CODE BLOCKS */
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 16px 0;
    overflow: hidden;
  }

  .code-header {
    background: var(--panel);
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .code-lang {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); font-family: 'JetBrains Mono', monospace;
  }

  .code-filename { font-size: 12px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }

  .copy-btn {
    background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2);
    color: var(--accent); border-radius: 6px; padding: 4px 10px;
    font-size: 11px; cursor: pointer; font-family: 'Sora', sans-serif;
    transition: all 0.2s;
  }

  .copy-btn:hover { background: rgba(0,212,255,0.2); }
  .copy-btn.copied { color: var(--accent3); border-color: rgba(0,255,148,0.3); background: rgba(0,255,148,0.1); }

  pre {
    padding: 20px;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; line-height: 1.7;
  }

  pre::-webkit-scrollbar { height: 4px; }
  pre::-webkit-scrollbar-track { background: transparent; }
  pre::-webkit-scrollbar-thumb { background: var(--border); }

  /* SYNTAX HIGHLIGHTING */
  .kw { color: #ff79c6; }       /* keywords */
  .fn { color: #50fa7b; }       /* functions */
  .str { color: #f1fa8c; }      /* strings */
  .cm { color: #6272a4; font-style: italic; } /* comments */
  .num { color: #bd93f9; }      /* numbers */
  .cls { color: #8be9fd; }      /* classes */
  .dec { color: #ffb86c; }      /* decorators */
  .imp { color: #ff5555; }      /* imports */

  /* CALLOUTS */
  .callout {
    border-radius: 10px; padding: 16px 20px;
    margin: 16px 0; display: flex; gap: 12px; align-items: flex-start;
  }

  .callout-info { background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.2); }
  .callout-warn { background: rgba(255,107,53,0.07); border: 1px solid rgba(255,107,53,0.2); }
  .callout-tip { background: rgba(0,255,148,0.07); border: 1px solid rgba(0,255,148,0.2); }

  .callout-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .callout p { margin: 0; font-size: 14px; }
  .callout-info p { color: #a8d8ea; }
  .callout-warn p { color: #ffb8a0; }
  .callout-tip p { color: #a0ffd4; }

  /* TAGS */
  .tag {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    font-family: 'JetBrains Mono', monospace;
  }

  .tag-get { background: rgba(0,255,148,0.15); color: var(--accent3); border: 1px solid rgba(0,255,148,0.3); }
  .tag-post { background: rgba(0,212,255,0.15); color: var(--accent); border: 1px solid rgba(0,212,255,0.3); }
  .tag-put { background: rgba(255,179,0,0.15); color: #ffb300; border: 1px solid rgba(255,179,0,0.3); }
  .tag-delete { background: rgba(255,107,53,0.15); color: var(--warn); border: 1px solid rgba(255,107,53,0.3); }
  .tag-patch { background: rgba(124,77,255,0.15); color: var(--accent2); border: 1px solid rgba(124,77,255,0.3); }

  /* INSTALL BOX */
  .install-box {
    background: var(--code-bg);
    border: 1px solid var(--accent3);
    border-radius: 10px; padding: 16px 20px; margin: 16px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
    color: var(--accent3);
  }

  .install-box::before { content: '$ '; color: var(--text2); }

  /* TABLE */
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th { background: var(--panel); padding: 10px 14px; text-align: left; font-size: 12px; color: var(--accent); border-bottom: 1px solid var(--border); }
  td { padding: 10px 14px; font-size: 13px; color: var(--text2); border-bottom: 1px solid rgba(42,53,96,0.5); }
  tr:hover td { background: rgba(0,212,255,0.03); }

  /* INLINE CODE */
  code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--panel); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 4px; font-size: 12px;
    color: var(--accent);
  }

  /* NAV ARROWS */
  .nav-arrows {
    padding: 32px 48px;
    display: flex; gap: 16px; justify-content: flex-end;
    max-width: 900px;
  }

  .nav-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text2); padding: 10px 20px; border-radius: 8px;
    cursor: pointer; font-family: 'Sora', sans-serif; font-size: 13px;
    transition: all 0.2s;
  }

  .nav-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.05); }

  /* HERO */
  .hero {
    padding: 64px 48px 48px;
    border-bottom: 1px solid var(--border);
    background: radial-gradient(ellipse at 0% 0%, rgba(0,212,255,0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 100% 100%, rgba(124,77,255,0.05) 0%, transparent 60%);
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,255,148,0.1); border: 1px solid rgba(0,255,148,0.2);
    color: var(--accent3); padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600; margin-bottom: 20px;
  }

  .hero h1 {
    font-size: 48px; font-weight: 800; line-height: 1.1; margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .hero p { font-size: 17px; color: var(--text2); max-width: 600px; line-height: 1.7; margin-bottom: 24px; }

  .hero-stats {
    display: flex; gap: 32px; flex-wrap: wrap;
  }

  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-num { font-size: 24px; font-weight: 800; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .stat-label { font-size: 12px; color: var(--text2); }

  /* RESPONSE EXAMPLE */
  .response-box {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px; margin: 12px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
  }

  .response-status {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 10px; font-size: 12px; font-weight: 700;
  }

  .status-200 { color: var(--accent3); }
  .status-404 { color: var(--warn); }
  .status-422 { color: #ffb300; }

  /* FLOW DIAGRAM */
  .flow {
    display: flex; align-items: center; gap: 0;
    margin: 20px 0; flex-wrap: wrap;
  }

  .flow-box {
    background: var(--panel); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    color: var(--text); white-space: nowrap;
  }

  .flow-arrow {
    color: var(--accent2); font-size: 18px; padding: 0 8px;
  }

  .hidden { display: none; }

  /* MOBILE */
  @media (max-width: 768px) {
    #sidebar { transform: translateX(-100%); transition: transform 0.3s; }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; max-width: 100vw; }
    .section { padding: 40px 24px; }
    .hero { padding: 40px 24px 32px; }
    .hero h1 { font-size: 32px; }
    .top-bar { padding: 14px 24px; }
    .nav-arrows { padding: 24px; }
    .hamburger { display: block !important; }
  }

  .hamburger {
    display: none;
    background: none; border: none; color: var(--text); cursor: pointer; font-size: 22px;
  }

  /* BACK TO TOP */
  #back-top {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--accent2); color: #fff;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; box-shadow: 0 4px 20px rgba(124,77,255,0.4);
    transition: all 0.2s; z-index: 200; opacity: 0;
  }

  #back-top.visible { opacity: 1; }
  #back-top:hover { transform: translateY(-3px); }
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="logo-icon">FA</div>
      <span class="logo-text">FastAPI</span>
    </div>
    <div class="sidebar-subtitle">Complete Beginner's Guide</div>
    <div class="search-box">
      <span style="color:var(--text2);font-size:14px;">🔍</span>
      <input type="text" placeholder="Search topics..." id="search-input">
    </div>
  </div>
  <div id="toc"></div>
</nav>

<!-- MAIN -->
<div id="main">
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="breadcrumb">FastAPI &rsaquo; <span id="current-topic">Getting Started</span></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
      <div class="progress-text" id="progress-text">0 / 35</div>
    </div>
  </div>

  <div id="content"></div>

  <div class="nav-arrows">
    <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Previous</button>
    <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next →</button>
  </div>
</div>

<div id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

<script>
const topics = [
  {
    title: "Introduction",
    content: `
    <div class="hero">
      <div class="hero-badge">⚡ The Fastest Way to Build APIs</div>
      <h1>FastAPI Complete<br>Beginner's Guide</h1>
      <p>Learn to build production-ready REST APIs with Python. This guide covers every topic from the official FastAPI tutorial — explained simply, with real code examples you can run immediately.</p>
      <div class="hero-stats">
        <div class="stat"><span class="stat-num">35</span><span class="stat-label">Topics Covered</span></div>
        <div class="stat"><span class="stat-num">100+</span><span class="stat-label">Code Examples</span></div>
        <div class="stat"><span class="stat-num">0</span><span class="stat-label">Prior API Knowledge Needed</span></div>
      </div>
    </div>
    <div class="section">
      <div class="section-header">
        <div class="section-num">INTRO</div>
        <h2>What is FastAPI?</h2>
      </div>
      <p>FastAPI is a modern Python framework for building APIs (Application Programming Interfaces). Think of an API as a waiter in a restaurant — you (the client) give your order (request) to the waiter (API), the waiter takes it to the kitchen (server/database), and brings back your food (response).</p>
      <h3>Why FastAPI?</h3>
      <table>
        <tr><th>Feature</th><th>What it means</th></tr>
        <tr><td>⚡ Fast</td><td>One of the fastest Python frameworks — as fast as Node.js</td></tr>
        <tr><td>📝 Auto Docs</td><td>Creates interactive API documentation automatically</td></tr>
        <tr><td>🔒 Type Safety</td><td>Uses Python type hints to catch bugs early</td></tr>
        <tr><td>✅ Validation</td><td>Automatically validates incoming data</td></tr>
        <tr><td>🐍 Modern Python</td><td>Uses Python 3.7+ features</td></tr>
      </table>
      <h3>Installation</h3>
      <p>Open your terminal and run these commands:</p>
      <div class="install-box">pip install fastapi uvicorn[standard]</div>
      <div class="callout callout-info">
        <div class="callout-icon">ℹ️</div>
        <p><strong>uvicorn</strong> is the server that runs your FastAPI app. Think of it like the engine that powers your API.</p>
      </div>
      <h3>How to run your app</h3>
      <div class="install-box">uvicorn main:app --reload</div>
      <p>This means: "Run the <code>app</code> object inside <code>main.py</code>, and auto-reload when I change the code."</p>
      <div class="callout callout-tip">
        <div class="callout-icon">💡</div>
        <p>Once running, visit <strong>http://127.0.0.1:8000/docs</strong> to see your interactive API documentation — automatically generated!</p>
      </div>
    </div>`
  },
  {
    title: "1. First Steps",
    content: `<div class="section">
      <div class="section-header">
        <div class="section-num">01</div>
        <h2>First Steps</h2>
      </div>
      <p>Let's write your very first FastAPI application. Create a file called <code>main.py</code>:</p>
      <div class="code-block">
        <div class="code-header">
          <span class="code-lang">python</span>
          <span class="code-filename">main.py</span>
          <button class="copy-btn" onclick="copyCode(this)">Copy</button>
        </div>
        <pre><span class="imp">from</span> <span class="cls">fastapi</span> <span class="imp">import</span> <span class="cls">FastAPI</span>

<span class="cm"># Step 1: Create the FastAPI "app"</span>
app = <span class="cls">FastAPI</span>()

<span class="cm"># Step 2: Create a route — a URL path your app responds to</span>
<span class="dec">@app.get</span>(<span class="str">"/"</span>)
<span class="kw">def</span> <span class="fn">read_root</span>():
    <span class="kw">return</span> {<span class="str">"message"</span>: <span class="str">"Hello World"</span>}

<span class="cm"># Step 3: Another route</span>
<span class="dec">@app.get</span>(<span class="str">"/about"</span>)
<span class="kw">def</span> <span class="fn">about</span>():
    <span class="kw">return</span> {<span class="str">"app"</span>: <span class="str">"My First FastAPI"</span>, <span class="str">"version"</span>: <span class="str">"1.0"</span>}</pre>
      </div>
      <h3>Understanding the code</h3>
      <table>
        <tr><th>Part</th><th>What it does</th></tr>
        <tr><td><code>from fastapi import FastAPI</code></td><td>Import the FastAPI class</td></tr>
        <tr><td><code>app = FastAPI()</code></td><td>Create your application instance</td></tr>
        <tr><td><code>@app.get("/")</code></td><td>A decorator — tells FastAPI "when someone visits /, run this function"</td></tr>
        <tr><td><code>def read_root():</code></td><td>The function that handles the request</td></tr>
        <tr><td><code>return {...}</code></td><td>FastAPI automatically converts this dict to JSON</td></tr>
      </table>
      <h3>HTTP Methods — the verbs of the web</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
        <span class="tag tag-get">GET</span> <span style="color:var(--text2);font-size:13px;align-self:center">Read data</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
        <span class="tag tag-post">POST</span> <span style="color:var(--text2);font-size:13px;align-self:center">Create new data</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
        <span class="tag tag-put">PUT</span> <span style="color:var(--text2);font-size:13px;align-self:center">Update/replace data</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
        <span class="tag tag-delete">DELETE</span> <span style="color:var(--text2);font-size:13px;align-self:center">Remove data</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
        <span class="tag tag-patch">PATCH</span> <span style="color:var(--text2);font-size:13px;align-self:center">Partially update data</span>
      </div>
      <div class="callout callout-tip">
        <div class="callout-icon">💡</div>
        <p>After running, visit <strong>http://127.0.0.1:8000/docs</strong> — you'll see a beautiful UI where you can test your API right in the browser!</p>
      </div>
    </div>`
  },
  {
    title: "2. Path Parameters",
    content: `<div class="section">
      <div class="section-header">

<span class="cm"># This is slow — we don't want user to wait</span>

// Build TOC
const toc = document.getElementById('toc');
topics.forEach((t, i) => {
  const div = document.createElement('div');
  div.className = 'toc-item' + (i === 0 ? ' active' : '');
  div.innerHTML = `<span class="toc-num">${i === 0 ? '★' : String(i).padStart(2,'0')}</span>${t.title}`;
  div.onclick = () => loadTopic(i);
  toc.appendChild(div);
});

let current = 0;

function loadTopic(index) {
  current = index;
  const content = document.getElementById('content');
  content.innerHTML = topics[index].content;
  
  // Update TOC
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });

  // Update breadcrumb
  document.getElementById('current-topic').textContent = topics[index].title;
  
  // Update progress
  const pct = Math.round((index / (topics.length - 1)) * 100);
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${index} / ${topics.length - 1}`;
  
  // Scroll to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  // Update nav buttons
  document.getElementById('prev-btn').style.opacity = index === 0 ? '0.3' : '1';
  document.getElementById('next-btn').style.opacity = index === topics.length - 1 ? '0.3' : '1';
  
  // Close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < topics.length) loadTopic(next);
}

// Search
document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.toc-item').forEach((el, i) => {
    el.style.display = !q || topics[i].title.toLowerCase().includes(q) ? 'flex' : 'none';
  });
});

// Back to top
window.addEventListener('scroll', () => {
  document.getElementById('back-top').classList.toggle('visible', window.scrollY > 300);
});

// Copy code
function copyCode(btn) {
  const pre = btn.closest('.code-block').querySelector('pre');
  const text = pre.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// Init
loadTopic(0);
